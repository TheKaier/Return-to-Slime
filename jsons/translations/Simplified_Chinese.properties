The Slime King devours adjacent low-level slimes to restore its own health. = 史莱姆王会吞噬相邻的低级史莱姆来恢复自身血量。
The Slime King deals area-of-effect damage in a 1-ring radius. = 史莱姆王会造成一环的范围伤害。
Every turn, the Slime King randomly teleports to a tile within a 3-tile range. = 史莱姆王每回合会随机转移到3格范围内地块。
As the Slime King's health decreases, it releases low-level slimes. = 史莱姆王会随着血量降低释放低级史莱姆。

The Slime Queen summons Bouncy, Flying, and Crystal Slimes within a 2- to 4-tile range. = 史莱姆女王会在2到4格的范围内召唤弹力、飞翔、水晶史莱姆。
The Slime Queen deals area-of-effect damage in a 1-ring radius. = 史莱姆女王会造成一环的范围伤害。
Every turn, the Slime Queen randomly teleports to a tile within a 3-tile range. = 史莱姆女王每回合会随机转移到3格范围内地块。
As the Slime Queen's health decreases, it gains increased attack and movement power. = 史莱姆女王会随着血量降低获得更高的攻击力和移动力。

The Slime God has Ebony Guardians and Blood Guardians. While the guardians are alive, it gains high defense. = 史莱姆之神拥有黑檀圣卫和血化圣卫，在圣卫存活时时获得高额防御力。
The Slime God charges power. Ebony Guardians can convert hostile units within a 2-tile range into slimes. = 史莱姆之神积蓄力量，黑檀圣卫能够将2格范围内的敌对单位变为史莱姆。
The Slime God charges power. Blood Guardians can seize control of hostile units within a 3-tile range. = 史莱姆之神积蓄力量，血化圣卫能够夺取3格范围内的敌对单位控制权。
After losing its Ebony Guardians and Blood Guardians, the Slime God deals true damage to enemies within a 2-tile range and summons new Ebony Guardians and Blood Guardians. = 史莱姆之神失去黑檀圣卫和血化圣卫后，对2格范围内的敌人造成真实伤害并召唤黑檀圣卫和血化圣卫。




