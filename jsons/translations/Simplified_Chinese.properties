史莱姆会产生凝胶化地形，在地形中的史莱姆会获得额外的生命恢复速度和移动速度。
文明可以快速移除
地形更倾向于战斗修正，而非产出


史莱姆会不断从地形的侵染中获得凝胶
吞噬资源会获得持续的凝胶

绿存活4t后
成为蓝
之后吞噬变成母
以及沙和冰


史莱姆知识作为阶段推进的计数
凝胶是快速回复史莱姆单位状态的资源
史莱姆巢穴就是蛮寨
吞噬和蜕变的史莱姆会产生信息载体，试图移动到巢穴中，这会强化史莱姆







史莱姆王会吞噬相邻的低级史莱姆来恢复自身血量

史莱姆王会造成一环的范围伤害

史莱姆王每回合会随机转移到3格范围内地块

史莱姆王会随着血量降低释放低级史莱姆


史莱姆女王会在2到4格的范围内召唤弹力、飞翔、水晶史莱姆

史莱姆女王会造成一环的范围伤害

史莱姆女王每回合会随机转移到3格范围内地块

史莱姆女王会随着血量降低获得更高的攻击力和移动力




史莱姆之神拥有黑檀圣卫和血化圣卫，在圣卫存活时时获得高额防御力

史莱姆之神积蓄力量，黑檀圣卫能够将2格范围内的敌对单位变为史莱姆

史莱姆之神积蓄力量，血化圣卫能够夺取2格范围内的敌对单位控制权

史莱姆之神失去黑檀圣卫和血化圣卫后，对2格范围内的敌人造成真实伤害并召唤黑檀圣卫和血化圣卫




