You have conquered countless empires, you have ignited atomic fire, you have built countless wonders. But this time, your enemy is not another civilization. It is intelligent gelatinous beings. End them before the slimes take over the world, or become a piece of knowledge in their memory? = 你曾征服过无数帝国、你点燃过原子之火、你建造过无数奇迹。但这一次你的敌人不是另一个文明。而是获得智慧的凝胶生物。在史莱姆占据世界之前终结它们，或者成为它们记忆中的一份知识？

It is dead. Or rather, it has finally stopped thinking. That mass of gel carrying billions of memories evaporated under the firepower of civilization, leaving only a gelatinous land—the sole evidence that it ever existed. You win. But your generals are silent after the battle. Because everyone asks the same question: Did we defeat the last Slime God, or the first? = 它死了。或者说，它终于停止了思考。那团承载着亿万记忆的凝胶在文明的火力下蒸发，留下的只是一片凝胶化的土地——那是它存在过的唯一证据。你赢了。但你的将军们在战后沉默不语。因为每个人都在问同一个问题：我们击败的，究竟是最后一个史莱姆之神，还是第一个？

